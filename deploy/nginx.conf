# Harmony Shake — static site served by unprivileged nginx (port 8080) behind fly.io's proxy.
# Security: strict CSP, no framing, HSTS, method/size limits, per-client rate limits, no server version.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 15s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Slow / oversized request protection: this site only serves files, it never accepts uploads.
  client_max_body_size      1k;
  client_body_timeout       10s;
  client_header_timeout     10s;
  send_timeout              15s;
  large_client_header_buffers 4 8k;

  # Real client IP from fly.io's proxy, used for rate limiting.
  map $http_fly_client_ip $client_ip {
    ""      $remote_addr;
    default $http_fly_client_ip;
  }
  limit_req_zone  $client_ip zone=perip:10m rate=20r/s;
  limit_conn_zone $client_ip zone=connip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req  zone=perip burst=80 nodelay;
    limit_conn connip 30;

    # Only reading is allowed.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # ── Security headers (also on error pages: "always") ──
    # CSP: only our own scripts/styles/fonts; images from our files or data: (icons, screenshot crops);
    # network access only to ourselves and the Anthropic API (screenshot reader). Inline style attributes are
    # needed by React; no inline or remote scripts are allowed, so an injected script can't run or leak the API key.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), clipboard-read=(), clipboard-write=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Never serve dotfiles (e.g. .git, .env) even if one slipped into the image.
    location ~ /\. { deny all; return 404; }

    # Hashed build assets never change: cache for a year.
    location ^~ /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ^~ /icons/ {
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # The page itself: always revalidate so deploys show up immediately. Routing uses #hash, so any
    # other path just gets the app (or 404 for missing files with an extension).
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), clipboard-read=(), clipboard-write=(self)" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
    location ~ \.[a-zA-Z0-9]+$ { try_files $uri =404; }
    location / { try_files $uri /index.html; }

    # Health check for fly.io (no logging noise).
    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  }
}
